<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My MP3 — một góc nghe nhạc riêng, nhẹ nhàng và đầy cảm hứng."
    />
    <link rel="icon" href="./assests/img/Logo.jpg" type="image/x-icon" />
    <title>My MP3 — listen slowly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./assests/font/fontawesome-free-6.1.1-web/css/all.min.css"
    />
    <link rel="stylesheet" href="./main.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      defer
    ></script>
  </head>
  <body>
    <div id="load" aria-label="Đang tải My MP3">
      <div class="loader-orbit loader-orbit-one"></div>
      <div class="loader-orbit loader-orbit-two"></div>
      <div class="loader-note"><i class="fa-solid fa-headphones"></i></div>
      <p>đang chuẩn bị một chút nhạc...</p>
    </div>

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <main class="container">
      <header class="topbar">
        <a class="brand" href="./" aria-label="My MP3 trang chủ">
          <span class="brand-icon"><i class="fa-solid fa-wave-square"></i></span>
          <span>
            <strong>my<span>mp3</span></strong>
            <small>listen slowly</small>
          </span>
        </a>
        <div class="topbar-actions">
          <div class="topbar-note">
            <span class="topbar-dot"></span>
            <span>your little music corner</span>
          </div>
          <button class="view-toggle" id="viewToggle" type="button" aria-pressed="false" aria-label="Chuyển sang giao diện danh sách">
            <span class="view-toggle-glyph" aria-hidden="true">
              <i class="fa-solid fa-atom orbit-glyph"></i>
              <i class="fa-solid fa-list-ul list-glyph"></i>
            </span>
            <span class="view-toggle-copy">
              <small>switch dimension</small>
              <strong class="view-toggle-mode">orbit view</strong>
            </span>
            <span class="view-toggle-arrow"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
          </button>
        </div>
      </header>

      <section class="player-layout" aria-label="Trình phát nhạc My MP3">
        <div class="app">
          <div class="music">
            <div class="videoapp" aria-hidden="true">
              <video autoplay muted loop id="changeVideo" src=""></video>
            </div>

            <div class="music-header">
              <span class="eyebrow"><i class="fa-solid fa-sparkles"></i> now playing</span>
              <span class="sound-wave" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i>
              </span>
            </div>

            <div class="music-main">
              <div class="album-stage">
                <span class="stage-ring stage-ring-one"></span>
                <span class="stage-ring stage-ring-two"></span>
                <div class="music-img music-img-an">
                  <img src="./assests/img/ChoDoiCoDangSoImg.jpg" alt="Ảnh bìa Chờ đợi có đáng sợ" />
                </div>
                <span class="stage-shine"></span>
              </div>

              <div class="track-heading">
                <div class="track-kicker">a song for this moment</div>
                <div class="music-run-wrapper">
                  <h1 class="music-name music-run">Chờ đợi có đáng sợ</h1>
                </div>
                <div class="mota-ngoai">
                  <span class="spanCaSi">ANDIEZ</span>
                </div>
              </div>

              <div class="progress-wrap">
                <input type="range" name="range" id="range" class="range" aria-label="Tiến trình bài hát" />
                <div class="timer">
                  <div class="thoiGianChay">00:00</div>
                  <div class="thoiGian">00:00</div>
                </div>
              </div>

              <audio src="./assests/musics/ChoDoiCoDangSo.mp3" id="song"></audio>

              <div class="controls" aria-label="Điều khiển trình phát">
                <button class="icon-button font-icon repeat-icon" type="button" aria-label="Lặp lại">
                  <i class="fa-solid fa-repeat"></i>
                </button>
                <button class="icon-button play-back" type="button" aria-label="Bài trước">
                  <i class="fa-solid fa-backward-step"></i>
                </button>
                <div class="play">
                  <button class="play-inner" type="button" aria-label="Phát nhạc">
                    <i class="fa-solid fa-play play-icon"></i>
                  </button>
                </div>
                <button class="icon-button play-next" type="button" aria-label="Bài tiếp theo">
                  <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="icon-button font-icon random-icon" type="button" aria-label="Phát ngẫu nhiên">
                  <i class="fa-solid fa-shuffle"></i>
                </button>
              </div>

              <div class="player-footer">
                <span class="footer-hint"><i class="fa-regular fa-moon"></i> nghe đến khi bạn ngủ</span>
                <label class="sleep-control" for="timeAfter">
                  <span>hẹn giờ</span>
                  <select id="timeAfter" aria-label="Hẹn giờ tắt nhạc">
                    <option value="0">Không hẹn</option>
                    <option value="15">Mười lăm phút</option>
                    <option value="30">Nửa tiếng</option>
                    <option value="60">Một tiếng</option>
                  </select>
                  <i class="fa-solid fa-chevron-down"></i>
                </label>
              </div>
            </div>
          </div>
        </div>

        <aside class="listM" aria-label="Danh sách phát">
          <div class="queue-heading">
            <div>
              <span class="eyebrow">orbiting collection</span>
              <h2>Music orbit</h2>
            </div>
            <span class="queue-count"><span class="count-number">33</span> signals</span>
          </div>
          <div class="orbit-controls" aria-label="Điều hướng quỹ đạo bài hát">
            <button class="orbit-step-prev" type="button" aria-label="Xoay quỹ đạo ngược lại">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span><i class="fa-solid fa-arrows-left-right"></i> scan orbit</span>
            <button class="orbit-step-next" type="button" aria-label="Xoay quỹ đạo tiếp theo">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>
          <div class="quick-pick">
            <label class="quick-search" for="songSearch">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input id="songSearch" type="search" placeholder="find a song..." autocomplete="off" />
              <kbd>/</kbd>
            </label>
            <div class="search-results" id="searchResults" role="listbox" aria-label="Kết quả tìm bài hát"></div>
          </div>
          <div class="cacBHs"></div>
        </aside>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
